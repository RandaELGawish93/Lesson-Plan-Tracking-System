<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body{

  font-family:Calibri,Arial,sans-serif;
  font-size:15px;
  line-height:1.8;
  color:#333333;
  background:#ffffff;
  margin:30px;

}

.container{

  max-width:750px;
  margin:auto;

}

.signature{

  margin-top:30px;
  padding-top:20px;
  border-top:2px solid #0b3b6e;

}

.signature-name{

  font-size:20px;
  font-weight:bold;
  color:#0b3b6e;

}

.signature-title{

  font-size:15px;
  color:#555555;
  margin-top:4px;

}

.signature-email{

  margin-top:12px;
  font-size:15px;

}

.signature-email a{

  color:#0b3b6e;
  text-decoration:none;

}

.signature-mission{

  margin-top:18px;
  font-size:13px;
  color:#666666;
  line-height:1.6;
  font-style:italic;

}

.footer{

  margin-top:25px;
  padding-top:15px;
  border-top:1px solid #d9d9d9;
  font-size:11px;
  color:#777777;

}

</style>

</head>

<body>

<div class="container">

<?!= content ?>

<div class="signature">

  <? if (senderName) { ?>
  <div class="signature-name">
    <?= senderName ?>
  </div>
  <? } ?>

  <div class="signature-title">
    Academic Dean's Office
  </div>

  <? if (senderEmail) { ?>
  <div class="signature-email">
    <a href="mailto:<?= senderEmail ?>"><?= senderEmail ?></a>
  </div>
  <? } ?>

  <? if (missionStatement) { ?>
  <div class="signature-mission">
    <?= missionStatement ?>
  </div>
  <? } ?>

</div>

<div class="footer">

<strong> Automated Academic Notification</strong>

<br><br>

This email was automatically generated by the
<strong>Lesson Plan Tracking System</strong>
on behalf of the Academic Dean's Office.

<br><br>

Please do not reply directly to this email.

<br><br>

If you require any clarification, kindly contact the Academic Dean's Office.

</div>

</div>

</body>

</html>
